<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador · Ventas App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#f0f0f0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:system-ui,-apple-system,sans-serif;
    gap:20px;
    padding:20px;
}

/* ── Toolbar ── */
.bar{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid #ddd;
    border-radius:14px;padding:8px 14px;
    flex-wrap:wrap;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.bar-sep{width:1px;height:22px;background:#ddd;margin:0 2px}
.bar-label{color:#999;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}

.sz{
    background:transparent;border:1.5px solid #ddd;color:#888;
    font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
    padding:5px 16px;border-radius:8px;cursor:pointer;transition:all .15s;
    display:flex;flex-direction:column;align-items:center;gap:1px;
}
.sz small{font-size:9px;font-weight:600;color:#bbb;letter-spacing:.04em}
.sz:hover{border-color:#999;color:#555}
.sz.on{background:#111;border-color:#111;color:#fff}
.sz.on small{color:#999}

.url-wrap{
    display:flex;align-items:center;gap:6px;
    background:#f5f5f5;border:1.5px solid #ddd;
    border-radius:8px;padding:4px 10px;
}
#urlInput{
    background:transparent;border:none;outline:none;
    color:#666;font-size:11px;width:200px;
}
.ico{
    background:transparent;border:1.5px solid #ddd;color:#888;
    width:30px;height:30px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;transition:all .15s;
}
.ico:hover{border-color:#999;color:#333}

/* ── Stage ── */
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
.dname{color:#888;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;transition:all .3s}

/* ── Phone shell ── */
.phone{
    background:linear-gradient(150deg,#242424 0%,#181818 100%);
    border-radius:54px;
    border:1.5px solid #323232;
    box-shadow:
        0 0 0 1px #0c0c0c,
        inset 0 0 0 1.5px #2d2d2d,
        0 70px 120px rgba(0,0,0,.95),
        0 0 0 8px #111;
    position:relative;
    padding:17px 13px 24px;
    transition:all .35s cubic-bezier(.4,0,.2,1);
}

/* Left buttons (volume + mute) */
.btn-l{position:absolute;left:-3.5px;top:108px;display:flex;flex-direction:column;gap:9px}
.btn-l div{width:3.5px;background:#262626;border-radius:2px 0 0 2px}

/* Right button (power) */
.btn-r{position:absolute;right:-3.5px;top:130px;width:3.5px;height:72px;background:#262626;border-radius:0 2px 2px 0}

/* Screen */
.screen{
    background:#000;border-radius:42px;overflow:hidden;
    position:relative;transition:all .35s cubic-bezier(.4,0,.2,1);
}

/* Status bar */
.sbar{
    position:absolute;top:0;left:0;right:0;height:50px;z-index:15;
    pointer-events:none;display:flex;align-items:flex-start;
    justify-content:space-between;padding:15px 24px 0;
}
.sbar-time{color:#fff;font-size:13px;font-weight:700}
.sbar-r{display:flex;align-items:center;gap:5px}

/* Home indicator */
.home-ind{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:130px;height:4px;background:rgba(255,255,255,.22);border-radius:3px;
    pointer-events:none;z-index:15;
}

iframe{display:block;border:none}
.dim{color:#bbb;font-size:10px;font-weight:700;letter-spacing:.04em;margin-top:2px}
.hint{color:#aaa;font-size:10px;font-weight:600;text-align:center;letter-spacing:.04em;line-height:1.6;max-width:360px}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="bar">
    <span class="bar-label">Tamaño</span>
    <button class="sz" data-s="s">S<small>360 × 780</small></button>
    <button class="sz on" data-s="m">M<small>393 × 852</small></button>
    <button class="sz" data-s="l">L<small>430 × 932</small></button>
    <div class="bar-sep"></div>
    <div class="url-wrap">
        <span style="color:#444;font-size:11px">🔗</span>
        <input id="urlInput" value="http://localhost:5173" placeholder="URL de la app"/>
    </div>
    <button class="ico" onclick="reloadApp()" title="Recargar">↻</button>
    <button class="ico" onclick="openTab()" title="Abrir en pestaña">↗</button>
</div>

<!-- Phone -->
<div class="stage">
    <div class="dname" id="dname">iPhone 15 · M — Estándar</div>

    <div class="phone" id="phone">

        <!-- Volume + mute left -->
        <div class="btn-l">
            <div style="height:30px"></div>
            <div style="height:58px"></div>
            <div style="height:58px"></div>
        </div>
        <!-- Power right -->
        <div class="btn-r"></div>

        <div class="screen" id="screen">
            <!-- Status bar -->
            <div class="sbar">
                <span class="sbar-time" id="clk">9:41</span>
                <div class="sbar-r">
                    <!-- Signal bars -->
                    <svg width="17" height="12" fill="#fff" viewBox="0 0 17 12">
                        <rect x="0"    y="6"  width="3" height="6"  rx="1" opacity=".4"/>
                        <rect x="4.5"  y="4"  width="3" height="8"  rx="1" opacity=".6"/>
                        <rect x="9"    y="1.5"width="3" height="10.5" rx="1" opacity=".8"/>
                        <rect x="13.5" y="0"  width="3" height="12" rx="1"/>
                    </svg>
                    <!-- Wifi -->
                    <svg width="15" height="12" fill="#fff" viewBox="0 0 15 12">
                        <circle cx="7.5" cy="11" r="1.5"/>
                        <path d="M4.3 8.2C5.2 7.3 6.3 6.8 7.5 6.8s2.3.5 3.2 1.4l1.2-1.3C10.6 5.6 9.1 5 7.5 5S4.4 5.6 3.1 6.9z" opacity=".65"/>
                        <path d="M1.6 5.5C3 4.1 5.2 3.2 7.5 3.2s4.5.9 5.9 2.3l1.2-1.3C12.8 2.6 10.3 1.5 7.5 1.5S2.2 2.6.4 4.2z" opacity=".3"/>
                    </svg>
                    <!-- Battery -->
                    <svg width="26" height="12" fill="#fff" viewBox="0 0 26 12">
                        <rect x=".5" y=".5" width="21" height="11" rx="2.5" stroke="rgba(255,255,255,.35)" stroke-width="1" fill="none"/>
                        <rect x="22" y="3.5" width="2.5" height="5" rx="1.2" opacity=".4"/>
                        <rect x="2" y="2" width="16" height="8" rx="1.5"/>
                    </svg>
                </div>
            </div>

            <iframe id="fr" src="http://localhost:5173"></iframe>
            <div class="home-ind"></div>
        </div>
    </div>

    <div class="dim" id="dim">393 × 852 px</div>
</div>

<p class="hint">Presiona <strong style="color:#333">S · M · L</strong> para cambiar tamaño &nbsp;·&nbsp; <strong style="color:#333">↻</strong> para recargar</p>

<script>
const SIZES = {
    s:{ w:360, h:780, name:'iPhone SE · S  —  Compacto'  },
    m:{ w:393, h:852, name:'iPhone 15 · M  —  Estándar'  },
    l:{ w:430, h:932, name:'iPhone 15 Plus · L  —  Grande'},
};

function applySize(k){
    const {w,h,name} = SIZES[k];
    const sc = document.getElementById('screen');
    const fr = document.getElementById('fr');
    sc.style.width  = w+'px';
    sc.style.height = h+'px';
    fr.style.width  = w+'px';
    fr.style.height = h+'px';
    document.getElementById('dname').textContent = name;
    document.getElementById('dim').textContent   = w+' × '+h+' px';
    document.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on', b.dataset.s===k));
}

document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>applySize(b.dataset.s)));

const inp = document.getElementById('urlInput');
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('fr').src=e.target.value; });
inp.addEventListener('change',  e=>{ document.getElementById('fr').src=e.target.value; });

function reloadApp(){ const f=document.getElementById('fr'); f.src=f.src; }
function openTab(){ window.open(inp.value,'_blank'); }

(function tick(){
    const n=new Date();
    document.getElementById('clk').textContent=
        String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    setTimeout(tick,15000);
})();

applySize('m');
</script>
</body>
</html>
