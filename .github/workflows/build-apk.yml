name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Sincronizar assets web → Android
        run: npx cap sync android

      - name: Agregar permisos Bluetooth al Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>|' "$MANIFEST"

      - name: Build APK debug
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK con número de versión
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             VentasRepartidor-v${{ github.run_number }}.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VentasRepartidor-v${{ github.run_number }}
          path: VentasRepartidor-v${{ github.run_number }}.apk
          retention-days: 90

      - name: Crear Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Ventas Repartidor v${{ github.run_number }}"
          files: VentasRepartidor-v${{ github.run_number }}.apk
          body: |
            ## Instalación en Android

            1. Descarga el archivo `.apk` aquí abajo
            2. En el teléfono: **Ajustes → Seguridad → Instalar apps de fuentes desconocidas → Activar**
            3. Abre el archivo descargado y toca **Instalar**
            4. ¡Listo! La app aparece en tu pantalla de inicio

            > Funciona en Android 8 o superior. No requiere Google Play.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
