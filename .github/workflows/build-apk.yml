name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Preparar assets Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/
          node -e "const cfg=require('./capacitor.config.json');require('fs').writeFileSync('android/app/src/main/assets/capacitor.config.json',JSON.stringify({appId:cfg.appId,appName:cfg.appName,bundledWebRuntime:false},null,2));"
          echo '{"ios":[],"android":[]}' > android/app/src/main/assets/capacitor.plugins.json
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          cat android/local.properties

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VentasRepartidor-v${{ github.run_number }}.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VentasRepartidor-v${{ github.run_number }}
          path: VentasRepartidor-v${{ github.run_number }}.apk
          retention-days: 90

      - name: Crear Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Ventas Repartidor v${{ github.run_number }}"
          files: VentasRepartidor-v${{ github.run_number }}.apk
          body: |
            Instalacion en Android:
            1. Descarga el .apk
            2. Ajustes - Seguridad - Fuentes desconocidas - Activar
            3. Abre el .apk e instala
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
