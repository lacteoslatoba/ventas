name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Configurar Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Copiar assets web → Android
        run: ./node_modules/.bin/cap copy android

      - name: Build APK debug
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             VentasRepartidor-v${{ github.run_number }}.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VentasRepartidor-v${{ github.run_number }}
          path: VentasRepartidor-v${{ github.run_number }}.apk
          retention-days: 90

      - name: Publicar Release con APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Ventas Repartidor v${{ github.run_number }}"
          files: VentasRepartidor-v${{ github.run_number }}.apk
          body: |
            ## Instalación en Android

            1. Descarga el archivo `.apk`
            2. En el cel: **Ajustes → Seguridad → Fuentes desconocidas → Activar**
            3. Abre el `.apk` e instala
            4. ¡Listo! La app aparece en tu pantalla de inicio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
