name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Instalar dependencias
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Build APK Debug
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew clean assembleDebug --no-daemon

      - name: Capturar APK
        run: |
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} VentasRepartidor.apk \;

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VentasRepartidor-v${{ github.run_number }}
          path: VentasRepartidor.apk
          retention-days: 90

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: "Ventas Repartidor v${{ github.run_number }}"
          files: VentasRepartidor.apk
          generate_release_notes: true
          body: |
            ### Instalacion en Android
            1. Descarga el archivo `VentasRepartidor.apk` adjunto.
            2. Si tu celular lo bloquea: ve a **Ajustes > Seguridad** y activa **Fuentes desconocidas**.
            3. Abre el archivo e instala.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
