<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Android · Simu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at top,#1a1a2e 0%,#0d0d0d 100%);
  display:flex;flex-direction:column;align-items:center;
  font-family:'Segoe UI',system-ui,sans-serif;
  gap:10px;padding:10px 16px 8px;
}

/* ── Toolbar ── */
.bar{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:7px 14px;
  flex-wrap:wrap;justify-content:center;
  backdrop-filter:blur(12px);width:100%;max-width:900px;
}
.bar-label{color:#666;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.bar-sep{width:1px;height:22px;background:rgba(255,255,255,.1);margin:0 2px}

.sz{
  background:transparent;border:1.5px solid rgba(255,255,255,.15);color:#777;
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
  padding:4px 12px;border-radius:9px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.sz small{font-size:8px;font-weight:600;color:#555;letter-spacing:.03em}
.sz:hover{border-color:rgba(255,255,255,.3);color:#ccc}
.sz.on{background:#4CAF50;border-color:#4CAF50;color:#fff}
.sz.on small{color:rgba(255,255,255,.7)}

.btn-font{
  background:transparent;border:1.5px solid rgba(255,255,255,.15);color:#777;
  font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:9px;cursor:pointer;transition:all .15s;
}
.btn-font:hover{border-color:rgba(255,255,255,.3);color:#ccc}
.btn-font.on{background:#2196F3;border-color:#2196F3;color:#fff}

.url-wrap{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.1);
  border-radius:9px;padding:4px 10px;
}
#urlInput{
  background:transparent;border:none;outline:none;
  color:#aaa;font-size:11px;width:200px;
}
#urlInput::placeholder{color:#555}
.ico{
  background:transparent;border:1.5px solid rgba(255,255,255,.15);color:#777;
  width:28px;height:28px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;
}
.ico:hover{border-color:rgba(255,255,255,.3);color:#ccc;background:rgba(255,255,255,.05)}

/* ── Stage wrapper: toma todo el espacio restante ── */
#stage-wrap{
  flex:1;min-height:0;
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:4px;
}

.stage{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transform-origin:top center;
}
.dname{color:#555;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.15em}
.dim{color:#3a3a3a;font-size:9px;font-weight:700;letter-spacing:.05em}

/* ── Android Phone Shell ── */
.phone{
  background:linear-gradient(160deg,#222 0%,#131313 50%,#0c0c0c 100%);
  border-radius:52px;
  border:1px solid #2e2e2e;
  box-shadow:
    0 0 0 1px #050505,
    0 0 0 9px #161616,
    0 0 0 10px #1d1d1d,
    inset 0 0 0 1px #333,
    0 60px 120px rgba(0,0,0,.95),
    0 0 80px rgba(76,175,80,.05);
  position:relative;
  padding:16px 12px 14px;
}

.btn-vol{position:absolute;left:-4px;top:120px;display:flex;flex-direction:column;gap:10px}
.btn-vol div{width:4px;background:#1e1e1e;border-radius:2px 0 0 2px;border:1px solid #2a2a2a;border-right:none}

.btn-pwr{
  position:absolute;right:-4px;top:150px;
  width:4px;height:68px;
  background:#1e1e1e;border-radius:0 2px 2px 0;
  border:1px solid #2a2a2a;border-left:none;
}

.screen{
  background:#000;
  border-radius:40px;
  overflow:hidden;
  position:relative;
}

.sbar{
  position:absolute;top:0;left:0;right:0;
  height:32px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
  pointer-events:none;
}
.sbar-time{color:#fff;font-size:12px;font-weight:600;letter-spacing:.03em}
.sbar-r{display:flex;align-items:center;gap:4px}

.punch{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:13px;height:13px;background:#000;border-radius:50%;
  z-index:25;box-shadow:0 0 0 1.5px #111;
}

/* Loading overlay */
.loader{
  position:absolute;inset:0;z-index:15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0d0d0d;gap:14px;
  transition:opacity .3s;
}
.loader.hidden{opacity:0;pointer-events:none}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(76,175,80,.2);
  border-top-color:#4CAF50;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-txt{color:#444;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}

.navbar{
  position:absolute;bottom:0;left:0;right:0;
  height:44px;background:rgba(0,0,0,.88);
  display:flex;align-items:center;justify-content:space-around;
  z-index:20;padding:0 30px 6px;
  border-top:1px solid rgba(255,255,255,.04);
}
.nav-btn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;cursor:pointer;
  opacity:.65;transition:opacity .15s;border-radius:50%;
}
.nav-btn:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav-btn svg{fill:#fff}

iframe{display:block;border:none;background:#fff;}
</style>
</head>
<body>

<div class="bar">
  <span class="bar-label">Tamaño</span>
  <button class="sz" data-s="s">S<small>360×800</small></button>
  <button class="sz on" data-s="m">M<small>393×851</small></button>
  <button class="sz" data-s="l">L<small>412×915</small></button>

  <div class="bar-sep"></div>

  <span class="bar-label">Letras</span>
  <button class="btn-font" data-f="14px">Chicas</button>
  <button class="btn-font on" data-f="16px">Normales</button>
  <button class="btn-font" data-f="20px">Grandes</button>

  <div class="bar-sep"></div>

  <div class="url-wrap">
    <span style="color:#555;font-size:12px">🔗</span>
    <input id="urlInput" value="/" placeholder="http://localhost:5180/"/>
  </div>
  <button class="ico" onclick="reloadApp()" title="Recargar">↻</button>
  <button class="ico" onclick="openTab()" title="Abrir en pestaña">↗</button>
</div>

<div id="stage-wrap">
  <div class="stage" id="stage">
    <div class="dname" id="dname">Android M — Estándar</div>

    <div class="phone" id="phone">
      <div class="btn-vol">
        <div style="height:36px"></div>
        <div style="height:56px"></div>
      </div>
      <div class="btn-pwr"></div>

      <div class="screen" id="screen">
        <div class="sbar">
          <span class="sbar-time" id="clk">9:41</span>
          <div class="sbar-r">
            <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="7" width="2.5" height="5" rx=".8" fill="white" opacity=".4"/><rect x="4" y="5" width="2.5" height="7" rx=".8" fill="white" opacity=".6"/><rect x="8" y="2.5" width="2.5" height="9.5" rx=".8" fill="white" opacity=".8"/><rect x="12" y="0" width="2.5" height="12" rx=".8" fill="white"/></svg>
            <svg width="15" height="12" viewBox="0 0 15 12"><circle cx="7.5" cy="11" r="1.4" fill="white"/><path d="M4.5 8C5.4 7.1 6.4 6.6 7.5 6.6s2.1.5 3 1.4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7"/><path d="M2 5.3C3.6 3.7 5.5 2.8 7.5 2.8s3.9.9 5.5 2.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".4"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="20" height="11" rx="2.5" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none"/><rect x="21" y="3.5" width="2.5" height="5" rx="1.2" fill="rgba(255,255,255,.4)"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/></svg>
          </div>
        </div>
        <div class="punch"></div>

        <div class="loader" id="loader">
          <div class="spinner"></div>
          <div class="loader-txt">Cargando app…</div>
        </div>

        <iframe id="fr" src="about:blank"></iframe>

        <div class="navbar">
          <div class="nav-btn" onclick="goBack()" title="Atrás"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
          <div class="nav-btn" onclick="goHome()" title="Inicio"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
          <div class="nav-btn" title="Recientes"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="7" width="11" height="14" rx="1.5" stroke="white" stroke-width="1.6" fill="none"/><rect x="7" y="4" width="11" height="14" rx="1.5" stroke="white" stroke-width="1.6" fill="none" opacity=".5"/></svg></div>
        </div>
      </div>
    </div>

    <div class="dim" id="dim">393 × 851 px</div>
  </div>
</div>

<script>
const SIZES = {
  s:{ w:360, h:800, name:'Android S  —  Compacto' },
  m:{ w:393, h:851, name:'Android M  —  Estándar'  },
  l:{ w:412, h:915, name:'Android L  —  Grande'    },
};

function calcScale(phoneW, phoneH) {
  const bar   = document.querySelector('.bar');
  const usedH = bar.offsetHeight + 60; // toolbar + labels + gaps
  const availH = window.innerHeight - usedH;
  const availW = window.innerWidth  - 48;
  const shellW = phoneW + 30;
  const shellH = phoneH + 60;
  const s = Math.min(availH / shellH, availW / shellW);
  // Allow up to 1.15× so it fills the screen on large monitors
  return Math.min(s, 1.15);
}

function applySize(k) {
  const {w, h, name} = SIZES[k];
  const sc = document.getElementById('screen');
  const fr = document.getElementById('fr');
  sc.style.width  = w + 'px';
  sc.style.height = h + 'px';
  fr.style.width  = w + 'px';
  fr.style.height = (h - 76) + 'px';
  fr.style.marginTop = '32px';
  document.getElementById('dname').textContent = name;
  document.getElementById('dim').textContent   = w + ' × ' + h + ' px';
  document.querySelectorAll('.sz').forEach(b => b.classList.toggle('on', b.dataset.s === k));

  const scale = calcScale(w, h);
  document.getElementById('stage').style.transform = `scale(${scale})`;
}

function applyFont(size, btn) {
  document.querySelectorAll('.btn-font').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  try {
    const fr = document.getElementById('fr');
    if (fr.contentDocument)
      fr.contentDocument.documentElement.style.fontSize = size;
  } catch(e) {}
}

// Hide loader once iframe loads
document.getElementById('fr').addEventListener('load', function() {
  const loader = document.getElementById('loader');
  if (this.src && this.src !== 'about:blank') {
    loader.classList.add('hidden');
    // Re-apply font setting
    const activeFont = document.querySelector('.btn-font.on');
    if (activeFont) applyFont(activeFont.dataset.f, null);
  }
});

document.querySelectorAll('.sz').forEach(b => b.addEventListener('click', () => applySize(b.dataset.s)));
document.querySelectorAll('.btn-font').forEach(b => b.addEventListener('click', () => applyFont(b.dataset.f, b)));

const inp = document.getElementById('urlInput');
inp.addEventListener('keydown', e => { if (e.key === 'Enter') loadUrl(e.target.value); });
inp.addEventListener('change',  e => { loadUrl(e.target.value); });

function loadUrl(url) {
  document.getElementById('loader').classList.remove('hidden');
  document.getElementById('fr').src = url;
}
function reloadApp() {
  document.getElementById('loader').classList.remove('hidden');
  const f = document.getElementById('fr');
  f.src = f.src;
}
function openTab() { window.open(inp.value, '_blank'); }
function goBack()  { try { document.getElementById('fr').contentWindow.history.back(); } catch(e){} }
function goHome()  { loadUrl(inp.value); }

// Init URL from query params
(function initAppUrl() {
  const q    = new URLSearchParams(location.search);
  const app  = q.get('app');
  const port = q.get('port');
  let base;
  if (app)                              base = app.replace(/\/?$/, '/');
  else if (port && /^\d{2,5}$/.test(port)) base = 'http://127.0.0.1:' + port + '/';
  else if (location.protocol === 'file:')  base = 'http://127.0.0.1:5180/';
  else                                  base = location.origin + '/';
  inp.value = base;
  document.getElementById('loader').classList.remove('hidden');
  document.getElementById('fr').src = base;
})();

// Clock
(function tick() {
  const n = new Date();
  document.getElementById('clk').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  setTimeout(tick, 10000);
})();

// Re-scale on resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const active = document.querySelector('.sz.on');
    if (active) applySize(active.dataset.s);
  }, 80);
});

applySize('m');
</script>
</body>
</html>
