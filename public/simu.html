<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Android · Simu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(ellipse at top,#1a1a2e 0%,#0d0d0d 100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Segoe UI',system-ui,sans-serif;
  gap:18px;
  padding:24px;
}

/* ── Toolbar ── */
.bar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:8px 14px;
  flex-wrap:wrap;justify-content:center;
  backdrop-filter:blur(12px);
}
.bar-label{color:#888;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.bar-sep{width:1px;height:22px;background:rgba(255,255,255,.1);margin:0 4px}

.sz{
  background:transparent;border:1.5px solid rgba(255,255,255,.15);color:#888;
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
  padding:5px 13px;border-radius:10px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.sz small{font-size:8.5px;font-weight:600;color:#555;letter-spacing:.03em}
.sz:hover{border-color:rgba(255,255,255,.3);color:#ccc}
.sz.on{background:#4CAF50;border-color:#4CAF50;color:#fff}
.sz.on small{color:rgba(255,255,255,.7)}

.btn-font{
  background:transparent;border:1.5px solid rgba(255,255,255,.15);color:#888;
  font-size:11px;font-weight:700;
  padding:6px 12px;border-radius:10px;cursor:pointer;transition:all .15s;
}
.btn-font:hover{border-color:rgba(255,255,255,.3);color:#ccc}
.btn-font.on{background:#2196F3;border-color:#2196F3;color:#fff}

.url-wrap{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;padding:4px 10px;
}
#urlInput{
  background:transparent;border:none;outline:none;
  color:#aaa;font-size:11px;width:220px;
}
#urlInput::placeholder{color:#555}
.ico{
  background:transparent;border:1.5px solid rgba(255,255,255,.15);color:#888;
  width:30px;height:30px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all .15s;
}
.ico:hover{border-color:rgba(255,255,255,.3);color:#ccc}

/* ── Stage ── */
.stage{display:flex;flex-direction:column;align-items:center;gap:6px; transform-origin: top center;}
.dname{color:#666;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.15em}
.dim{color:#444;font-size:10px;font-weight:700;letter-spacing:.05em;margin-top:2px}

/* ── Android Phone Shell ── */
.phone{
  background:linear-gradient(160deg,#1c1c1c 0%,#111 50%,#0a0a0a 100%);
  border-radius:52px;
  border:1px solid #2a2a2a;
  box-shadow:
    0 0 0 1px #050505,
    0 0 0 9px #141414,
    0 0 0 10px #1a1a1a,
    inset 0 0 0 1px #2e2e2e,
    0 80px 140px rgba(0,0,0,.98),
    0 0 60px rgba(76,175,80,.04);
  position:relative;
  padding:16px 12px 14px;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}

.btn-vol{position:absolute;left:-4px;top:120px;display:flex;flex-direction:column;gap:10px}
.btn-vol div{width:4px;background:#1e1e1e;border-radius:2px 0 0 2px;border:1px solid #2a2a2a;border-right:none}

.btn-pwr{
  position:absolute;right:-4px;top:150px;
  width:4px;height:68px;
  background:#1e1e1e;border-radius:0 2px 2px 0;
  border:1px solid #2a2a2a;border-left:none;
}

.screen{
  background:#000;
  border-radius:40px;
  overflow:hidden;
  position:relative;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}

.sbar{
  position:absolute;top:0;left:0;right:0;
  height:32px;z-index:20;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
  pointer-events:none;
}
.sbar-time{color:#fff;font-size:12px;font-weight:600;letter-spacing:.03em;font-family:'Roboto',system-ui,sans-serif}
.sbar-r{display:flex;align-items:center;gap:4px}

.punch{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:13px;height:13px;
  background:#000;
  border-radius:50%;
  z-index:25;
  box-shadow:0 0 0 1.5px #111;
}

.navbar{
  position:absolute;bottom:0;left:0;right:0;
  height:44px;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:space-around;
  z-index:20;
  padding:0 30px 6px;
  border-top:1px solid rgba(255,255,255,.04);
}
.nav-btn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;cursor:pointer;
  opacity:.7;transition:opacity .15s;
  border-radius:50%;
}
.nav-btn:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav-btn svg{fill:#fff}

iframe{display:block;border:none;background:#fff;image-rendering:high-quality;}
</style>
</head>
<body>

<div class="bar">
  <span class="bar-label">Tamaño App</span>
  <button class="sz" data-s="s">S<small>360×800</small></button>
  <button class="sz on" data-s="m">M<small>393×851</small></button>
  <button class="sz" data-s="l">L<small>412×915</small></button>

  <div class="bar-sep"></div>

  <span class="bar-label">Letras</span>
  <button class="btn-font" data-f="14px">Chicas</button>
  <button class="btn-font on" data-f="16px">Normales</button>
  <button class="btn-font" data-f="20px">Grandes</button>

  <div class="bar-sep"></div>

  <div class="url-wrap">
    <span style="color:#555;font-size:12px">🔗</span>
    <input id="urlInput" value="/" placeholder="URL app o ?port=5183"/>
  </div>
  <button class="ico" onclick="reloadApp()" title="Recargar">↻</button>
  <button class="ico" onclick="openTab()" title="Abrir en pestaña">↗</button>
</div>

<div class="stage" id="stage">
  <div class="dname" id="dname">Android M — Estándar</div>

  <div class="phone" id="phone">
    <div class="btn-vol">
      <div style="height:36px"></div>
      <div style="height:56px"></div>
    </div>
    <div class="btn-pwr"></div>

    <div class="screen" id="screen">
      <div class="sbar">
        <span class="sbar-time" id="clk">9:41</span>
        <div class="sbar-r">
          <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="7" width="2.5" height="5" rx=".8" fill="white" opacity=".4"/><rect x="4" y="5" width="2.5" height="7" rx=".8" fill="white" opacity=".6"/><rect x="8" y="2.5" width="2.5" height="9.5" rx=".8" fill="white" opacity=".8"/><rect x="12" y="0" width="2.5" height="12" rx=".8" fill="white"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12"><circle cx="7.5" cy="11" r="1.4" fill="white"/><path d="M4.5 8C5.4 7.1 6.4 6.6 7.5 6.6s2.1.5 3 1.4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7"/><path d="M2 5.3C3.6 3.7 5.5 2.8 7.5 2.8s3.9.9 5.5 2.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".4"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="20" height="11" rx="2.5" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none"/><rect x="21" y="3.5" width="2.5" height="5" rx="1.2" fill="rgba(255,255,255,.4)"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/></svg>
        </div>
      </div>
      <div class="punch"></div>
      <iframe id="fr" src="about:blank"></iframe>
      <div class="navbar">
        <div class="nav-btn" onclick="goBack()" title="Atrás"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
        <div class="nav-btn" onclick="goHome()" title="Inicio"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
        <div class="nav-btn" title="Recientes"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="7" width="11" height="14" rx="1.5" stroke="white" stroke-width="1.6" fill="none"/><rect x="7" y="4" width="11" height="14" rx="1.5" stroke="white" stroke-width="1.6" fill="none" opacity=".5"/></svg></div>
      </div>
    </div>
  </div>

  <div class="dim" id="dim">393 × 851 px</div>
</div>

<script>
const SIZES = {
  s:{ w:360, h:800, name:'Android S  —  Compacto' },
  m:{ w:393, h:851, name:'Android M  —  Estándar'  },
  l:{ w:412, h:915, name:'Android L  —  Grande'    },
};

function applySize(k){
  const {w,h,name} = SIZES[k];
  const sc = document.getElementById('screen');
  const fr = document.getElementById('fr');
  sc.style.width  = w+'px';
  sc.style.height = h+'px';
  fr.style.width  = w+'px';
  fr.style.height = (h - 76)+'px';
  fr.style.marginTop = '32px';
  document.getElementById('dname').textContent = name;
  document.getElementById('dim').textContent   = w+' × '+h+' px';
  document.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on', b.dataset.s===k));

  const stage = document.getElementById('stage');
  const availableHeight = window.innerHeight - 150;
  const availableWidth  = window.innerWidth  - 48;
  const phoneHeight = h + 80;
  const phoneWidth  = w + 40;
  const scaleH = availableHeight / phoneHeight;
  const scaleW = availableWidth  / phoneWidth;
  const scale  = Math.min(scaleH, scaleW, 1);
  // zoom re-renderiza a la escala final → texto nítido (sin blur de CSS scale)
  stage.style.zoom      = scale;
  stage.style.transform = '';
}

function applyFont(size, btn) {
    document.querySelectorAll('.btn-font').forEach(b=>b.classList.remove('on'));
    if(btn) btn.classList.add('on');

    try {
        const fr = document.getElementById('fr');
        if (fr.contentDocument) {
            fr.contentDocument.documentElement.style.fontSize = size;
        }
    } catch(e) {
        console.warn('CORS: tamaño de letra solo con misma origen (http)');
    }
}

document.getElementById('fr').onload = function() {
    const activeFontBtn = document.querySelector('.btn-font.on');
    if (activeFontBtn) {
        applyFont(activeFontBtn.dataset.f, null);
    }
};

document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>applySize(b.dataset.s)));
document.querySelectorAll('.btn-font').forEach(b=>b.addEventListener('click',()=>applyFont(b.dataset.f, b)));

const inp = document.getElementById('urlInput');
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') loadUrl(e.target.value); });
inp.addEventListener('change',  e=>{ loadUrl(e.target.value); });

(function initAppUrl(){
  const fr = document.getElementById('fr');
  const q = new URLSearchParams(location.search);
  const app = q.get('app');
  const port = q.get('port');
  let base;
  if (app) base = app.replace(/\/?$/, '/');
  else if (port && /^\d{2,5}$/.test(port)) base = 'http://localhost:' + port + '/';
  else if (location.protocol === 'file:') base = 'http://localhost:5173/';
  else base = location.origin + '/';
  inp.value = base;
  fr.src = base;
})();

function loadUrl(url){ document.getElementById('fr').src = url; }
function reloadApp(){ const f=document.getElementById('fr'); f.src=f.src; }
function openTab(){ window.open(inp.value,'_blank'); }
function goBack(){ try{ document.getElementById('fr').contentWindow.history.back(); }catch(e){} }
function goHome(){ loadUrl(inp.value); }

(function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  setTimeout(tick,10000);
})();

window.addEventListener('resize', () => {
    const active = document.querySelector('.sz.on');
    if(active) applySize(active.dataset.s);
});

applySize('m');
</script>
</body>
</html>
