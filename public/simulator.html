<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Simulador Android — Ventas Repartidor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    gap: 16px;
  }

  .label {
    color: #94a3b8;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Marco del celular */
  .phone {
    position: relative;
    width: 393px;
    background: #1e293b;
    border-radius: 52px;
    padding: 14px 10px;
    box-shadow:
      0 0 0 2px #334155,
      0 0 0 4px #1e293b,
      0 0 0 6px #475569,
      0 40px 80px rgba(0,0,0,0.7);
  }

  /* Notch / barra superior */
  .phone-bar {
    height: 36px;
    background: #0f172a;
    border-radius: 40px 40px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .notch {
    width: 110px;
    height: 26px;
    background: #0f172a;
    border-radius: 0 0 18px 18px;
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 10;
  }
  .notch-cam {
    width: 10px; height: 10px;
    background: #1e293b;
    border-radius: 50%;
    border: 2px solid #334155;
  }
  .notch-pill {
    width: 48px; height: 6px;
    background: #334155;
    border-radius: 3px;
  }

  /* Pantalla */
  .screen {
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .screen iframe {
    width: 100%;
    height: 780px;
    border: none;
    display: block;
  }

  /* Barra de home */
  .phone-home {
    height: 32px;
    background: #0f172a;
    border-radius: 0 0 40px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-bar {
    width: 120px;
    height: 5px;
    background: #475569;
    border-radius: 3px;
  }

  /* Botones laterales */
  .btn-vol {
    position: absolute;
    left: -5px;
    width: 4px;
    border-radius: 2px;
    background: #334155;
  }
  .btn-vol.up   { top: 90px;  height: 40px; }
  .btn-vol.down { top: 142px; height: 40px; }
  .btn-power {
    position: absolute;
    right: -5px;
    top: 110px;
    width: 4px;
    height: 60px;
    border-radius: 2px;
    background: #334155;
  }

  /* Info del dispositivo */
  .device-info {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #64748b;
    font-size: 11px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

  /* Controles */
  .controls {
    display: flex;
    gap: 8px;
  }
  .ctrl-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { background: #334155; color: #fff; }
</style>
</head>
<body>

  <div class="label">Simulador Android · Pixel 7</div>

  <div class="phone">
    <!-- Botones -->
    <div class="btn-vol up"></div>
    <div class="btn-vol down"></div>
    <div class="btn-power"></div>

    <!-- Barra estado -->
    <div class="phone-bar">
      <span id="clock">9:41</span>
      <div class="notch">
        <div class="notch-cam"></div>
        <div class="notch-pill"></div>
      </div>
      <span>▲ WiFi 🔋</span>
    </div>

    <!-- Pantalla con la app -->
    <div class="screen">
      <iframe
        id="appFrame"
        src="http://localhost:5173"
        allow="bluetooth; camera; microphone"
      ></iframe>
    </div>

    <!-- Home bar -->
    <div class="phone-home">
      <div class="home-bar"></div>
    </div>
  </div>

  <div class="device-info">
    <div class="dot"></div>
    <span>localhost:5173 · 393×780px · Android 13</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="document.getElementById('appFrame').src='http://localhost:5173'">↺ Recargar</button>
    <button class="ctrl-btn" onclick="document.getElementById('appFrame').contentWindow.history.back()">← Atrás</button>
  </div>

  <script>
    // Reloj en tiempo real
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>

</body>
</html>
