<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Centro de Instalación — Ventas Repartidor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap">
  <style>
    :root {
      --primary: #ffb91a;
      --primary-dark: #e5a510;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --info: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 480px; }

    .header { text-align: center; margin-bottom: 40px; }
    .logo {
      width: 100px; height: 100px;
      background: white;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
    .subtitle { color: var(--text-muted); font-size: 16px; font-weight: 400; }

    .card {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 32px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .badge {
      position: absolute; top: 20px; right: 20px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h2 { font-size: 22px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    p { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 24px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 20px;
      border-radius: 20px;
      font-size: 18px; font-weight: 800;
      text-decoration: none; border: none; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }

    .btn-primary { background: var(--primary); color: #000; box-shadow: 0 10px 20px rgba(255, 185, 26, 0.2); }
    .btn-outline { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid rgba(255,255,255,0.1); margin-top: 12px; }
    .btn-disabled { background: #334155; color: #64748b; cursor: default; }

    .steps { margin-top: 24px; text-align: left; }
    .step { display: flex; gap: 16px; margin-bottom: 20px; }
    .step-icon {
      width: 32px; height: 32px;
      background: rgba(255, 185, 26, 0.15);
      color: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; flex-shrink: 0;
    }
    .step-content b { color: var(--text); display: block; margin-bottom: 2px; }
    .step-content span { font-size: 14px; color: var(--text-muted); }

    .info-box {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px; padding: 20px;
      color: #93c5fd; font-size: 14px; line-height: 1.5;
      margin-bottom: 24px;
    }

    #status-bar {
      font-size: 12px; color: var(--text-muted);
      margin-top: 32px; opacity: 0.5;
      text-align: center;
    }

    /* Modal / Hidden section for security help */
    #security-help {
      display: none;
      background: #1e1b4b;
      border: 1px dashed #4338ca;
      border-radius: 24px;
      padding: 24px;
      margin-top: 16px;
      text-align: left;
    }
    #security-help h3 { font-size: 16px; color: #c7d2fe; margin-bottom: 8px; }

    .platform-warning {
      background: #450a0a; border: 1px solid #991b1b;
      color: #fecaca; padding: 20px; border-radius: 24px;
      margin-bottom: 24px; text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">
      <img src="/logo.png" alt="Logo">
    </div>
    <h1>Ventas Repartidor</h1>
    <p class="subtitle">Portal de Instalación Profesional</p>
  </div>

  <div id="main-content">
    <!-- Will be filled by JS -->
    <div style="text-align: center; padding: 40px; opacity: 0.5;">Detectando tu dispositivo...</div>
  </div>

  <div id="status-bar"></div>
</div>

<script>
  const APP_URL = 'https://ventas-delta.vercel.app/';
  const APK_URL = '/VentasRepartidor.apk'; // Hypothesized APK location
  
  const ua = navigator.userAgent;
  const isChrome = /Chrome/i.test(ua) && !/Edg|OPR|SamsungBrowser/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isBT = 'bluetooth' in navigator;

  const main = document.getElementById('main-content');
  const statusBar = document.getElementById('status-bar');

  function showPWAInstaller() {
    main.innerHTML = `
      <div class="card">
        <div class="badge">Recomendado</div>
        <h2>📱 Instalación Directa</h2>
        <p>Instala la aplicación de forma segura y rápida sin archivos externos. Es la forma más confiable.</p>
        
        <button id="btnInstall" class="btn btn-disabled">Preparando...</button>
        
        <div id="manual-steps" style="display:none">
          <div class="steps">
            <div class="step">
              <div class="step-icon">1</div>
              <div class="step-content">
                <b>Abrir Menú</b>
                <span>Toca los 3 puntos <b>⋮</b> en la esquina superior de Chrome.</span>
              </div>
            </div>
            <div class="step">
              <div class="step-icon">2</div>
              <div class="step-content">
                <b>Instalar App</b>
                <span>Busca la opción <b>"Instalar aplicación"</b> o "Añadir a pantalla de inicio".</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="background: rgba(255,255,255,0.02)">
        <h2>📦 Descarga Tradicional (APK)</h2>
        <p>Usa esta opción solo si la instalación directa no funciona en tu dispositivo.</p>
        <a href="${APK_URL}" class="btn btn-outline" id="btnApk">
          <span style="font-size:24px">📥</span> Descargar archivo APK
        </a>
        <button class="btn btn-outline" style="border:none; color: var(--info); font-size: 14px;" onclick="toggleSecurityHelp()">
          ¿Aparece un aviso de seguridad? Ver qué hacer
        </button>
        
        <div id="security-help">
          <h3>🛡️ Sobre los avisos de seguridad</h3>
          <p style="margin-bottom:12px; font-size:13px; color: #a5b4fc;">
            Android muestra avisos para aplicaciones descargadas fuera de la Play Store. Esto es normal para herramientas internas de la empresa.
          </p>
          <div class="steps" style="margin-top:0">
            <div class="step">
              <div class="step-icon" style="background:rgba(199,210,254,0.1); color:#c7d2fe;">!</div>
              <div class="step-content">
                <span style="color:#e0e7ff">Si sale <b>"Archivo dañino"</b>, toca <b>"Descargar de todos modos"</b>.</span>
              </div>
            </div>
            <div class="step">
              <div class="step-icon" style="background:rgba(199,210,254,0.1); color:#c7d2fe;">!</div>
              <div class="step-content">
                <span style="color:#e0e7ff">Si pide permisos, ve a <b>Ajustes</b> y activa <b>"Permitir desde esta fuente"</b>.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    setupPWAEvents();
  }

  function setupPWAEvents() {
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btnInstall');
      btn.className = 'btn btn-primary';
      btn.innerHTML = '✨ Instalar App Ahora';
      btn.onclick = async () => {
        btn.disabled = true;
        btn.innerHTML = 'Instalando...';
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btn.innerHTML = '🚀 ¡Instalada!';
          setTimeout(() => window.location.href = APP_URL, 1000);
        } else {
          btn.disabled = false;
          btn.innerHTML = '✨ Instalar App Ahora';
        }
      };
      document.getElementById('manual-steps').style.display = 'none';
    });

    // If after 3 seconds no prompt, show manual steps
    setTimeout(() => {
      if (!deferredPrompt) {
        const btn = document.getElementById('btnInstall');
        btn.className = 'btn btn-outline';
        btn.innerHTML = '▶️ Entrar a la App';
        btn.onclick = () => window.location.href = APP_URL;
        document.getElementById('manual-steps').style.display = 'block';
      }
    }, 3000);
  }

  function toggleSecurityHelp() {
    const help = document.getElementById('security-help');
    help.style.display = help.style.display === 'block' ? 'none' : 'block';
  }

  // Router logic
  if (!isAndroid) {
    main.innerHTML = `
      <div class="platform-warning">
        <h2>⚠️ Dispositivo no compatible</h2>
        <p>Esta aplicación está optimizada para dispositivos Android con Google Chrome.</p>
      </div>
      <a href="${APP_URL}" class="btn btn-primary">Continuar de todos modos</a>
    `;
  } else if (!isChrome) {
    main.innerHTML = `
      <div class="info-box">
        <b>¡Atención!</b> Estás usando un navegador diferente. Para usar la impresora Bluetooth e instalar la app correctamente, usa <b>Google Chrome</b>.
      </div>
      <div class="card">
        <h2>Abrir en Chrome</h2>
        <p>Toca el botón para cambiar de navegador:</p>
        <a href="intent://${APP_URL.replace('https://', '')}#Intent;scheme=https;package=com.android.chrome;end" class="btn btn-primary">🔵 Abrir en Chrome</a>
      </div>
    `;
  } else {
    showPWAInstaller();
  }

  statusBar.textContent = `Plataforma: ${isAndroid ? 'Android' : 'Otra'} | Navegador: ${isChrome ? 'Chrome' : 'Otro'} | Bluetooth: ${isBT ? 'SÍ' : 'NO'}`;
</script>

</body>
</html>
